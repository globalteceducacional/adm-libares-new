# Credenciais: DB_URL, DB_USER, DB_PASSWORD (padrão user root / senha root).
# Se o MySQL local não usar essa senha, defina as variáveis no PowerShell ou use
# application-local.yml (veja application-local.example.yml + perfil local).
spring:
  application:
    name: adm-libare-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/adm_libare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
      # Mantém o nome de @Table/@Column literal (ex.: Autores_site).
      # Sem isso o Spring converte para minusculas e quebra no MySQL Linux (case-sensitive).
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # VPS/legado: repair roda so depois do validate; desliga validate no boot
    # para conseguir limpar success=0 e reaplicar V4/V5 out-of-order.
    validate-on-migrate: false
    out-of-order: true
    repair-on-migrate: true

server:
  port: 8080
  # Nginx termina TLS e encaminha HTTP — respeita X-Forwarded-Proto/Host.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  data:
    mode: ${APP_DATA_MODE:legacy}
  auth:
    legacy-admin-enabled: false
  legacy:
    assets:
      # Raiz do PHP legado (pasta que contém images/). Vazio = tenta ../adm-libares a partir do user.dir.
      root: ${LEGACY_ASSETS_ROOT:}
    public-base-url: ${LEGACY_PUBLIC_BASE_URL:http://localhost:8080}
  security:
    # Chave base64 para assinatura JWT em ambientes reais.
    jwt-secret: ${JWT_SECRET:VGhpcy1pcy1hLXN0cm9uZy1kZW1vLWp3dC1zZWNyZXQta2V5LTIwMjY=}
    jwt-expiration-minutes: 60
    # Origins CORS (separados por virgula). Override: CORS_ALLOWED_ORIGIN_PATTERNS
    cors-allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://187.127.0.245:*,http://187.127.47.204:*,https://admin.alenxandriaglobaltec.com,https://*.alenxandriaglobaltec.com}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    urls:
      - name: Admin
        url: /v3/api-docs/admin

