# Credenciais: DB_URL, DB_USER, DB_PASSWORD (padrão user postgres / senha admin).
# Se o PostgreSQL local não usar essa senha, defina as variáveis no PowerShell ou use
# application-local.yml (veja application-local.example.yml + perfil local).
spring:
  application:
    name: adm-libare-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/adm_libare_core}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  data:
    mode: ${APP_DATA_MODE:core}
  legacy:
    assets:
      # Raiz do PHP legado (pasta que contém images/). Vazio = tenta ../adm-libares a partir do user.dir.
      root: ${LEGACY_ASSETS_ROOT:}
  security:
    # Chave base64 para assinatura JWT em ambientes reais.
    jwt-secret: ${JWT_SECRET:VGhpcy1pcy1hLXN0cm9uZy1kZW1vLWp3dC1zZWNyZXQta2V5LTIwMjY=}
    jwt-expiration-minutes: 60
