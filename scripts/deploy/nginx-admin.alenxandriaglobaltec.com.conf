# Reverse proxy no HOST da VPS: HTTPS -> container frontend (:5173)
# Instalacao: bash scripts/deploy/setup-domain-vps.sh

server {
    listen 80;
    listen [::]:80;
    server_name admin.alenxandriaglobaltec.com;

    # Certbot injeta o desafio ACME aqui quando rodar --nginx
    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-School-Context $http_x_school_context;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }
}
