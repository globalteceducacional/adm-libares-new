services:
  db:
    image: mysql:8.4
    container_name: adm-libare-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: adm_libare
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adm-libare-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/adm_libare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: root
      DB_PASSWORD: root
      JWT_SECRET: VGhpcy1pcy1hLXN0cm9uZy1kZW1vLWp3dC1zZWNyZXQta2V5LTIwMjY=
      # URL publica usada em links absolutos de upload (deve ser acessivel no browser)
      LEGACY_PUBLIC_BASE_URL: ${LEGACY_PUBLIC_BASE_URL:-http://187.127.47.204:5173}
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*,http://187.127.47.204:*,https://admin.alenxandriaglobaltec.com,https://*.alenxandriaglobaltec.com}
      # Pasta no container com images/ e uploads/ do PHP (montar volume abaixo)
      LEGACY_ASSETS_ROOT: ${LEGACY_ASSETS_ROOT:-/legacy-assets}
    # Sem ports no host: 8080/8081 ja sao da luditeca neste VPS.
    # API externa: http://<ip>:5173/api e /legacy/assets (proxy do frontend → backend:8080).
    volumes:
      # No host: coloque/copie a pasta adm-libares (ou so images+uploads) e ajuste o caminho
      - ${LEGACY_ASSETS_HOST_PATH:-./legacy-assets}:/legacy-assets:ro

  frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_LEGACY_REMOTE_IMAGES_BASE_URL: ${VITE_LEGACY_REMOTE_IMAGES_BASE_URL:-https://ebook.alenxandriaglobaltec.com/images}
    container_name: adm-libare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
