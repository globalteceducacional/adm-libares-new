services:
  db:
    image: postgres:16
    container_name: adm-libare-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: adm_libare_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adm_libare_core"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: adm-libare-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/adm_libare_core
      DB_USER: postgres
      DB_PASSWORD: admin
      APP_DATA_MODE: core
      LEGACY_ASSETS_ROOT: /legacy-assets
      JWT_SECRET: VGhpcy1pcy1hLXN0cm9uZy1kZW1vLWp3dC1zZWNyZXQta2V5LTIwMjY=
    ports:
      - "8080:8080"
    volumes:
      # Pasta host com images/ e uploads/ (copiar de adm-libares)
      - ./legacy-assets:/legacy-assets:ro

  frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        # Vazio = mesmo origin do admin; nginx faz proxy /api -> backend:8080
        VITE_API_BASE_URL: ""
    container_name: adm-libare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
